    <style>
      /* ================================================================
         FOFURAS PET — Link na Bio
         ================================================================
         DESIGN TOKENS: troque as variáveis abaixo para ajustar a paleta
         ================================================================ */
      :root {
        /* -- Cores da marca (troque aqui) ----------------------------- */
        --brand-yellow: #fec200;       /* Amarelo/dourado principal      */
        --brand-yellow-dark: #e5ad00;  /* Hover do botão WhatsApp        */
        --brand-yellow-glow: rgba(254, 194, 0, 0.38);
        --brand-blue: #0354a6;         /* Azul da marca                  */
        --brand-blue-dark: #023e7a;
        --brand-blue-soft: rgba(3, 84, 166, 0.10);

        /* -- Fundo ---------------------------------------------------- */
        --bg-top: #fff9ee;             /* Início do gradiente de fundo   */
        --bg-bottom: #fff1d6;          /* Fim do gradiente de fundo      */

        /* -- Texto ---------------------------------------------------- */
        --ink: #23272b;
        --body-text: #4b5158;
        --muted: #868e96;

        /* -- Componentes ---------------------------------------------- */
        --glass-bg: rgba(255, 255, 255, 0.72);
        --glass-border: rgba(255, 255, 255, 0.88);
        --shadow-btn: 0 4px 18px rgba(3, 84, 166, 0.10);
        --shadow-main: 0 8px 32px var(--brand-yellow-glow);
        --r: 20px;

        /* -- Tipografia ----------------------------------------------- */
        --font-head: "Sora", system-ui, sans-serif;
        --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
      }

      /* -- Reset mínimo --------------------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-body);
        background: linear-gradient(
          160deg,
          var(--bg-top) 0%,
          var(--bg-bottom) 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }

      /* ================================================================
         PATINHAS FLUTUANTES DE FUNDO
         ================================================================ */
      .paws-bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .paw-float {
        position: absolute;
        fill: var(--brand-blue);
        opacity: 0.06;
        animation: floatPaw ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes floatPaw {
        0%   { transform: translateY(0px)   rotate(var(--rot-a, 0deg)); }
        50%  { transform: translateY(-20px) rotate(var(--rot-b, 10deg)); }
        100% { transform: translateY(0px)   rotate(var(--rot-a, 0deg)); }
      }

      /* Patinhas individuais: posição, tamanho e timing distintos */
      .p1  { width: 52px; top:  4%;  left:  5%;  animation-duration: 9s;  animation-delay: 0s;   --rot-a: -10deg; --rot-b: 5deg; }
      .p2  { width: 34px; top:  8%;  left: 80%;  animation-duration: 12s; animation-delay: -2s;  --rot-a: 15deg;  --rot-b: 30deg; }
      .p3  { width: 64px; top: 18%;  left: 15%;  animation-duration: 14s; animation-delay: -5s;  --rot-a: -5deg;  --rot-b: 10deg; }
      .p4  { width: 28px; top: 20%;  left: 70%;  animation-duration: 8s;  animation-delay: -1s;  --rot-a: 20deg;  --rot-b: 35deg; }
      .p5  { width: 44px; top: 35%;  left:  2%;  animation-duration: 11s; animation-delay: -4s;  --rot-a: -15deg; --rot-b: 0deg; }
      .p6  { width: 56px; top: 40%;  left: 88%;  animation-duration: 13s; animation-delay: -7s;  --rot-a: 5deg;   --rot-b: 18deg; }
      .p7  { width: 38px; top: 55%;  left: 22%;  animation-duration: 10s; animation-delay: -3s;  --rot-a: -20deg; --rot-b: -8deg; }
      .p8  { width: 26px; top: 58%;  left: 75%;  animation-duration: 7s;  animation-delay: -6s;  --rot-a: 12deg;  --rot-b: 25deg; }
      .p9  { width: 48px; top: 70%;  left:  8%;  animation-duration: 15s; animation-delay: -2s;  --rot-a: -8deg;  --rot-b: 5deg; }
      .p10 { width: 36px; top: 75%;  left: 60%;  animation-duration: 9s;  animation-delay: -9s;  --rot-a: 18deg;  --rot-b: 32deg; }
      .p11 { width: 60px; top: 85%;  left: 85%;  animation-duration: 16s; animation-delay: -4s;  --rot-a: -12deg; --rot-b: 2deg; }
      .p12 { width: 32px; top: 90%;  left: 30%;  animation-duration: 11s; animation-delay: -8s;  --rot-a: 8deg;   --rot-b: 20deg; }

      /* ================================================================
         CONTAINER PRINCIPAL
         ================================================================ */
      .page {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 480px;
        padding: 52px 20px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ================================================================
         AVATAR / LOGO
         ================================================================ */
      .avatar-wrap {
        /* TROQUE o src da <img> abaixo pela logo real.
           Sugestão: /assets/logo.png (já está no projeto).
           Tamanho ideal: 200×200 px, fundo transparente. */
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 4px solid var(--brand-yellow);
        box-shadow:
          0 0 0 6px rgba(254, 194, 0, 0.22),
          0 8px 28px rgba(254, 194, 0, 0.28);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        flex-shrink: 0;
        margin-bottom: 22px;
      }
      .avatar-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ================================================================
         PERFIL
         ================================================================ */
      .profile-name {
        font-family: var(--font-head);
        font-size: 24px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: -0.025em;
        text-align: center;
        line-height: 1.15;
      }
      .profile-name span {
        color: var(--brand-blue);
      }

      .profile-location {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        margin-top: 6px;
      }
      .profile-location svg {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
        fill: var(--muted);
      }

      .profile-tagline {
        font-family: var(--font-body);
        font-size: 15px;
        font-weight: 500;
        color: var(--body-text);
        margin-top: 12px;
        text-align: center;
        line-height: 1.55;
        max-width: 320px;
      }

      /* ================================================================
         DIVISOR
         ================================================================ */
      .divider {
        width: 44px;
        height: 3px;
        background: var(--brand-yellow);
        border-radius: 4px;
        margin: 26px 0;
        box-shadow: 0 2px 8px rgba(254, 194, 0, 0.4);
      }

      /* ================================================================
         LISTA DE LINKS
         ================================================================ */
      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* Botão base (glassmorphism suave) */
      .link-btn {
        display: flex;
        align-items: center;
        gap: 13px;
        width: 100%;
        padding: 17px 22px;
        border-radius: var(--r);
        font-family: var(--font-head);
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
        background: var(--glass-bg);
        border: 1.5px solid var(--glass-border);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--shadow-btn);
        transition:
          transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.22s ease,
          background 0.18s ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        position: relative;
      }

      .link-btn:hover,
      .link-btn:focus-visible {
        transform: scale(1.025) translateY(-2px);
        box-shadow: 0 10px 32px rgba(3, 84, 166, 0.16);
      }
      .link-btn:active {
        transform: scale(0.975);
        transition-duration: 0.1s;
      }
      .link-btn:focus-visible {
        outline: 3px solid var(--brand-blue);
        outline-offset: 3px;
      }

      /* Botão principal: WhatsApp */
      .link-btn--main {
        background: var(--brand-yellow);
        border-color: var(--brand-yellow);
        color: var(--ink);
        padding: 20px 22px;
        font-size: 16px;
        font-weight: 700;
        box-shadow: var(--shadow-main);
      }
      .link-btn--main:hover,
      .link-btn--main:focus-visible {
        background: var(--brand-yellow-dark);
        border-color: var(--brand-yellow-dark);
        box-shadow: 0 12px 40px var(--brand-yellow-glow);
        transform: scale(1.03) translateY(-3px);
      }
      .link-btn--main:focus-visible {
        outline-color: var(--brand-blue-dark);
      }

      /* Ícone de patinha nos botões */
      .btn-paw {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        fill: currentColor;
      }

      /* Animação de balançar na patinha do botão principal */
      .link-btn--main .btn-paw {
        animation: pawWag 3s ease-in-out infinite;
      }
      @keyframes pawWag {
        0%, 60%, 100% { transform: rotate(0deg); }
        70%  { transform: rotate(-14deg); }
        80%  { transform: rotate(14deg); }
        90%  { transform: rotate(-8deg); }
        95%  { transform: rotate(6deg); }
      }

      .btn-label {
        flex: 1;
        line-height: 1.3;
      }

      /* Seta decorativa à direita */
      .btn-arrow {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        opacity: 0.45;
        stroke: currentColor;
        fill: none;
        transition: opacity 0.2s, transform 0.2s;
      }
      .link-btn:hover .btn-arrow,
      .link-btn:focus-visible .btn-arrow {
        opacity: 0.75;
        transform: translateX(3px);
      }

      /* Botão do site principal — azul leve */
      .link-btn--site {
        background: rgba(3, 84, 166, 0.07);
        border-color: rgba(3, 84, 166, 0.28);
        color: var(--brand-blue);
      }
      .link-btn--site:hover,
      .link-btn--site:focus-visible {
        background: rgba(3, 84, 166, 0.13);
        border-color: var(--brand-blue);
        box-shadow: 0 10px 32px rgba(3, 84, 166, 0.18);
      }
      .link-btn--site:focus-visible {
        outline-color: var(--brand-blue-dark);
      }

      /* ================================================================
         RODAPÉ
         ================================================================ */
      .bio-footer {
        margin-top: 44px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .bio-footer a {
        color: var(--brand-blue);
        font-weight: 600;
        text-decoration: none;
      }
      .bio-footer a:hover {
        text-decoration: underline;
      }

      /* ================================================================
         RESPONSIVO
         ================================================================ */
      @media (max-width: 400px) {
        .page { padding: 40px 16px 52px; }
        .profile-name { font-size: 22px; }
        .link-btn { padding: 16px 18px; font-size: 14px; }
        .link-btn--main { padding: 18px 18px; font-size: 15px; }
      }
    </style>
  </head>
  <body>
